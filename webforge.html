function genCSS(m,L=pr.els,sel_=SELF){let b='',t='',x='',d='';const has=o=>Object.keys(o).length;
if(m=='p')return L.map(e=>sel_(e)+'{'+css(eff(e))+'}').join('\n');if(m=='d'){L.forEach(e=>{b+=`${sel_(e)}{${css(eff(e,'d'))}}\n`;if(has(e.st.t))t+=`${sel_(e)}{${css(e.st.t)}}\n`;if(has(e.st.m))x+=`${sel_(e)}{${css(e.st.m)}}\n`});return b+(t?`@media(max-width:1023px){\n${t}}\n`:'')+(x?`@media(max-width:767px){\n${x}}\n`:'')}
L.forEach(e=>{b+=`${sel_(e)}{${css(eff(e,'m'))}}\n`;t+=`${sel_(e)}{${css(eff(e,'t'))}}\n`;d+=`${sel_(e)}{${css(eff(e,'d'))}}\n`});return b+`@media(min-width:768px){\n${t}}\n@media(min-width:1024px){\n${d}}\n`}
function genHTML(){const fs=new Set(['Inter']);[...pr.els,...pr.cls.flatMap(c=>c.els)].forEach(e=>['d','t','m'].forEach(b=>{const f=e.st[b].fontFamily;if(f)fs.add(f.split(',')[0].replace(/['"]/g,''))}));
const body=pr.els.filter(e=>!e.pid).map(e=>node(e,1).outerHTML.replace(/></g,'>\n<')).join('\n');
return`<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${esc(pr.name)}</title>\n<link href="https://fonts.googleapis.com/css2?${[...fs].map(f=>'family='+f.replace(/ /g,'+')).join('&')}&display=swap" rel="stylesheet">\n<style>\n*{box-sizing:border-box}body{margin:0;position:relative;min-height:100vh;${css(pr.pg)}}\n${genCSS(pr.exp)}${pr.cls.map(c=>genCSS(pr.exp,c.els,e=>'.pf-'+e.id)).join('')}</style>\n</head>\n<body>\n${body}\n<script>\n${genJS()}\n<\/script>\n</body>\n</html>`}
function expUI(){openM('Código do projeto',`<div class="bar"><label class="bar">Tipo de exportação:<select id="et" onchange="pr.exp=this.value;queue();$('#code').value=genHTML()"><option value="d">Computador (padrão · @media max-width)</option><option value="m">Celular primeiro (@media min-width)</option></select></label><button onclick="navigator.clipboard?.writeText($('#code').value);toast('Copiado')">${I('copy')}Copiar</button><button onclick="dlf('index.html',$('#code').value,'text/html')">${I('dl')}Baixar</button><button onclick="applyCode()">${I('pen')}Aplicar edições ao projeto</button></div><textarea id="code" spellcheck="false"></textarea>`);$('#et').value=pr.exp;$('#code').value=genHTML()}
function dlf(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function applyCode(){const d=new DOMParser().parseFromString($('#code').value,'text/html'),R={},old=Object.fromEntries(pr.els.map(e=>[e.cid||e.id,e])),out=[],TG={h1:'heading',h2:'heading',h3:'heading',p:'text',button:'button',img:'image',input:'input',textarea:'textarea',a:'link',hr:'divider',ul:'list',select:'select',div:'container',video:'video'};
(d.querySelector('style')?.textContent||'').split('@media')[0].replace(/#([\w-]+)\s*\{([^}]*)\}/g,(m,i,b)=>R[i]=b);
const pd=s=>{const o={};(s||'').split(';').forEach(x=>{const i=x.indexOf(':');if(i>0)o[x.slice(0,i).trim().replace(/-(\w)/g,(m,c)=>c.toUpperCase())]=x.slice(i+1).trim()});return o};
const walk=(n,pid)=>[...n.children].forEach(c=>{const t=TG[c.tagName.toLowerCase()];if(!t)return;const o=old[c.id],e=o&&o.type==t?o:mk(t,pid,0,0);if(!o)e.cid=/^wf/.test(c.id)?'':c.id;e.pid=pid;if(!T[t].box){e.txt=c.dataset.tpl||(t=='list'?[...c.children].map(l=>l.textContent).join('\n'):t=='select'?[...c.children].map(l=>l.textContent).join(','):t=='input'||t=='textarea'?c.placeholder:c.textContent)||e.txt}e.src=c.getAttribute('src')||c.getAttribute('href')||e.src;e.cls=c.className||'';
if(R[c.id]||c.getAttribute('style')){e.st.d=Object.assign(pd(R[c.id]),pd(c.getAttribute('style')))}out.push(e);if(t=='container')walk(c,e.id)});
walk(d.querySelector('.site-wrapper')||d.body,null);pr.els=out;sel=null;all();queue();closeM();toast('Código aplicado')}
/* ---------- projetos ---------- */
function newProj(n){return{id:uid(),name:n||'Meu Projeto',ts:Date.now(),exp:'d',els:[],js:'',vars:[{n:'count',v:'0'}]}}
function openP(id){snap();pr=fixP(DB.find(p=>p.id==id)||DB[0]);hist=[];hi=-1;sel=null;prev=0;P.last=pr.id;sp();snap();all();hdr();closeM()}
function projUI(){snap();openM('Projetos',`<div class="bar"><button onclick="DB.push(newProj('Projeto '+(DB.length+1)));ls.set('wf_projs',DB);openP(DB[DB.length-1].id)">${I('plus')}Novo projeto</button><button onclick="impP()">${I('up')}Importar .json</button></div><div class="pg">${[...DB].sort((a,b)=>b.ts-a.ts).map(p=>`<div class="pc"><b>${esc(p.name)}${p==pr?' (aberto)':''}</b><small>${p.els.length} elementos · ${new Date(p.ts).toLocaleString('pt-BR')}</small><div class="bar"><button class="on" onclick="openP('${p.id}')">Abrir</button><button title="Duplicar" onclick="dupP('${p.id}')">${I('copy')}</button><button title="Exportar .json" onclick="dlf('${esc(p.name)}.json',JSON.stringify(DB.find(x=>x.id=='${p.id}')),'application/json')">${I('dl')}</button><button title="Excluir" onclick="delP('${p.id}')">${I('trash')}</button></div></div>`).join('')}</div>`)}
function dupP(id){const p=JSON.parse(JSON.stringify(DB.find(x=>x.id==id)));p.id=uid();p.name+=' (cópia)';DB.push(p);ls.set('wf_projs',DB);projUI()}
function delP(id){if(!confirm('Excluir este projeto?'))return;DB=DB.filter(p=>p.id!=id);if(!DB.length)DB.push(newProj());ls.set('wf_projs',DB);if(pr.id==id)openP(DB[0].id);projUI()}
function impP(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const p=JSON.parse(t);p.id=uid();p.exp=p.exp||'d';DB.push(p);ls.set('wf_projs',DB);projUI()}catch(e){toast('JSON inválido')}});i.click()}
function openM(t,h){$('#mt').textContent=t;$('#mc').innerHTML=h;$('#md').classList.add('o')}function closeM(){$('#md').classList.remove('o')}
function help(){openM('Atalhos de teclado',`<div class="pg" style="grid-template-columns:1fr 1fr">${[['Ctrl+S','Salvar'],['Ctrl+Z / Ctrl+Y','Desfazer / Refazer'],['Ctrl+D','Duplicar'],['Ctrl+C / Ctrl+V','Copiar / Colar (ou imagem)'],['Delete','Excluir'],['Setas (Shift = 10px)','Mover (posição exata)'],['[ e ]','Ordem nas camadas'],['Ctrl+Enter','Preview'],['Ctrl+E','Código / exportar'],['Ctrl+P','Projetos'],['Esc','Desselecionar'],['Duplo clique','Editar texto']].map(a=>`<div class="pc"><b>${a[0]}</b><small>${a[1]}</small></div>`).join('')}</div>`)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey,ty=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
if(c&&k=='s'){e.preventDefault();snap();toast('Projeto salvo');return}if(c&&k=='enter'){e.preventDefault();togglePrev();return}if(k=='escape'){closeM();if(!ty)pick(null);return}if(ty)return;
const m={z:()=>e.shiftKey?redo():undo(),y:redo,d:dupS,c:()=>clip=sel,v:()=>{const o=clip&&find(clip);if(o){const n=cl(o,o.pid,1);draw();pick(n.id);queue()}},e:expUI,p:projUI}[k];
if(c&&m){e.preventDefault();m();return}if(c)return;
if(k=='delete'||k=='backspace'){e.preventDefault();delS()}else if(k=='['){mv(-1)}else if(k==']'){mv(1)}else if(k=='f5'){e.preventDefault();togglePrev()}else if(k.startsWith('arrow')){const n=e.shiftKey?10:1;if(cur()){e.preventDefault();nudge(k=='arrowleft'?-n:k=='arrowright'?n:0,k=='arrowup'?-n:k=='arrowdown'?n:0)}}});
addEventListener('beforeunload',snap);
addEventListener('wheel',e=>{const t=e.target;if(t.tagName!='INPUT'||/color|file|checkbox/.test(t.type)||t.hasAttribute('data-nw'))return;const m=/^(-?\d*\.?\d+)([a-z%]*)$/.exec(t.value.trim());if(!m)return;e.preventDefault();const st=t.step?parseFloat(t.step)||1:/\./.test(m[1])?.1:1;let n=+(+m[1]+((e.deltaY||e.deltaX)<0?1:-1)*st*(e.shiftKey?10:1)).toFixed(2);if(t.min!=='')n=Math.max(+t.min,n);if(t.max!=='')n=Math.min(+t.max,n);t.value=n+m[2];t.dispatchEvent(new Event('input',{bubbles:true}))},{passive:false});
function fixP(p){p.pg=p.pg||{backgroundColor:'#ffffff'};p.cls=p.cls||[];return p}
function G(k){const t=$('#gt').value,a=$('#g1').value,b=$('#g2').value,d=$('#ga').value||90;S(k,t=='linear'?`linear-gradient(${d}deg,${a},${b})`:t=='radial'?`radial-gradient(${a},${b})`:'')}
const CI=['cls','star','heart','bolt','user','cart','bell','home','flag','cube','box','image','button','text'];
function palette(){const d=(k,i,n,c,x='')=>`<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${k}')" onclick="${c}">${I(i)}<span>${esc(n)}</span>${x}</div>`;$('#pg').innerHTML=Object.keys(T).map(k=>d(k,T[k].i,T[k].n,`add('${k}');if(innerWidth<800)tg('L')`)).join('')+(pr.cls.length?`<div style="grid-column:span 2;cursor:default;border:0;background:none;color:var(--ac);font-weight:700;align-items:flex-start;padding:4px 0">Classes</div>`+pr.cls.map(c=>d(c.id,c.icon,c.name,`spawnC('${c.id}');if(innerWidth<800)tg('L')`,`<button title="Excluir classe" onclick="event.stopPropagation();delC('${c.id}')" style="padding:1px 3px">${I('x')}</button>`)).join(''):'')}
function delC(id){pr.cls=pr.cls.filter(c=>c.id!=id);palette();queue()}
function clsUI(){const e=cur();if(!e)return;openM('Nova classe (prefab)',`<label class="fl">Nome<input data-nw id="cn" value="${esc(e.cid||T[e.type].n)}"></label><div class="mu">Ícone</div><div class="bar" id="ci">${CI.map((k,i)=>`<button class="${i?'':'on'}" data-k="${k}" onclick="document.querySelectorAll('#ci button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${I(k)}</button>`).join('')}</div><button class="on" onclick="mkCls('${e.id}')">${I('plus')}Criar classe</button>`)}
function mkCls(id){const e=find(id),L=[],w=(x,p)=>{const c=JSON.parse(JSON.stringify(x));c.pid=p;c.cid='';c.ev=[];L.push(c);pr.els.filter(k=>k.pid==x.id).forEach(k=>w(k,x.id))};w(e,null);['d','t','m'].forEach(b=>['position','left','top'].forEach(k=>delete L[0].st[b][k]));pr.cls.push({id:uid(),name:$('#cn').value||'Classe',icon:$('#ci .on').dataset.k,els:L});closeM();palette();queue();toast('Classe criada: arraste da paleta')}
function spawnC(id,pid=null,x,y){const c=pr.cls.find(k=>k.id==id);if(!c)return;if(x==null){const s=cur();if(s&&T[s.type].box)pid=s.id;x=20+pr.els.length%8*20;y=x}const m={},r=c.els.map(e=>{const k=JSON.parse(JSON.stringify(e));m[e.id]=k.id=uid();return k});r.forEach(k=>k.pid=k.pid?m[k.pid]:pid);if(P.snap=='abs')Object.assign(r[0].st.d,{position:'absolute',left:x+'px',top:y+'px'});pr.els.push(...r);draw();pick(r[0].id);queue()}
function pfHTML(c){NL=c.els;const h=node(c.els[0],2).outerHTML;NL=null;return h}
function RT(){return`const AN=${JSON.stringify(AN)};\nconst PF=${JSON.stringify(Object.fromEntries(pr.cls.map(c=>[c.id,pfHTML(c)]))).replace(/</g,'\\u003c')};\nfunction wfFmt(s){return String(s).replace(/\\{(\\w+)\\}/g,(m,k)=>V[k]??'')}\nfunction wfN(s){return s!==''&&!isNaN(s)?+s:s}\nfunction wfCalc(x){try{return new Function('V','with(V)return('+x+')')(V)}catch(e){console.error(e.message)}}\nfunction wfGet(e,p){return{value:e.value,checked:e.checked,text:e.textContent,len:(e.value??e.textContent).length,x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight,opacity:+getComputedStyle(e).opacity}[p]}\nfunction wfSet(e,p,v){if(p=='value')e.value=v;else if(p=='checked')e.checked=v=='true';else if(p=='text')e.textContent=v;else if(p=='x')e.style.left=v+'px';else if(p=='y')e.style.top=v+'px';else if(p=='w')e.style.width=v+'px';else if(p=='h')e.style.height=v+'px';else if(p=='opacity')e.style.opacity=v;else if(p=='color')e.style.color=v;else if(p=='bg')e.style.backgroundColor=v;else if(p=='hidden')e.style.display=v=='true'?'none':''}\nfunction wfAnim(e,n,ms){e.animate(AN[n],{duration:ms,easing:'ease',fill:/Out/.test(n)?'forwards':'none'})}\nfunction wfSpawn(k,x,y,p){const t=document.createElement('template');t.innerHTML=PF[k]||'';const n=t.content.firstElementChild;if(!n)return;if(x!==''){n.style.position='absolute';n.style.left=parseFloat(x)+'px';n.style.top=parseFloat(y)+'px'}(p||document.getElementById('root')||document.body).append(n);wfUpd();return n}\n`}
/* ---------- UI ---------- */
const tg=s=>{['L','R'].forEach(x=>$('#'+x).classList.toggle('open',x==s&&!$('#'+x).classList.contains('open')))};
function ltab(t){P.ltab=t;sp();$('#pal').style.display=t=='pal'?'':'none';$('#lay').style.display=t=='lay'?'':'none';$('#tp').className=t=='pal'?'on':'';$('#tl').className=t=='lay'?'on':''}
function vbar(){$('#vb').innerHTML=[['d','desk','Desktop 1024+'],['t','tab','Tablet 768'],['m','mob','Mobile 375']].map(([k,i,l])=>`<button class="${P.bp==k?'on':''}" onclick="setBP('${k}')" title="${l}">${I(i)}<span class="hd">${l}</span></button>`).join('')+`<span class="mu hd" style="margin-left:6px">${P.bp=='d'?'Edição base (Desktop)':'Alterações salvas como @media'}</span>`}
function hdr(){$('#hd').innerHTML=`<button class="mo" onclick="tg('L')" title="Elementos">${I('layers')}</button><b class="lg">WF</b><input id="pn" class="pn" value="${esc(pr.name)}" oninput="pr.name=this.value;queue()" title="Nome do projeto"><button onclick="projUI()" title="Projetos (Ctrl+P)">${I('folder')}<span class="hd">Projetos</span></button><button onclick="undo()" title="Desfazer (Ctrl+Z)">${I('undo')}</button><button onclick="redo()" title="Refazer (Ctrl+Y)">${I('redo')}</button><span class="seg"><button class="${P.snap=='abs'?'on':''}" onclick="sn('abs')" title="Posição exata">${I('move')}</button><button class="${P.snap=='grid'?'on':''}" onclick="sn('grid')" title="Juntar ao grid (lista)">${I('grid')}</button></span><button onclick="dupS()" title="Duplicar (Ctrl+D)">${I('copy')}</button><button onclick="delS()" title="Excluir (Del)">${I('trash')}</button><button class="${prev?'on':''}" onclick="togglePrev()" title="Preview (Ctrl+Enter)">${I(prev?'stop':'play')}<span class="hd">${prev?'Editar':'Preview'}</span></button><button onclick="expUI()" title="Código (Ctrl+E)">${I('code')}<span class="hd">Código</span></button><button onclick="snap();toast('Projeto salvo')" title="Salvar (Ctrl+S)">${I('save')}</button><button onclick="help()" title="Atalhos">${I('kbd')}</button><button class="mo" onclick="tg('R')" title="Inspetor">${I('sliders')}</button>`}
function init(){
$('#tp').innerHTML=I('box')+'Elementos';$('#tl').innerHTML=I('layers')+'Hierarquia';$('#mb .tabs button').innerHTML=I('x');
if(!DB.length)DB.push(newProj());pr=fixP(DB.find(p=>p.id==P.last)||DB[0]);P.bp='d';snap();hdr();vbar();all();ltab(P.ltab);btab(P.bt)}
init();
</script></body></html>
